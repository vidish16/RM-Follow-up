name: Daily Slack Follow-up Digest

on:
  schedule:
    # "30 3 * * *" in UTC = 9:00 AM IST (UTC+5:30), once a day
    - cron: "30 3 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Call the daily digest endpoint
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/cron/slack-daily-digest" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP status: %{http_code}\n"
